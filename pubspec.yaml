name: domex_edu
description: "Plataforma de Gestão Escolar B2B Multi-Tenant"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.3
  mask_text_input_formatter: ^2.9.0
  image_picker: ^1.2.3
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  flutter_colorpicker: ^1.1.0
  image_cropper: ^12.2.1
  firebase_storage: ^13.5.0
  url_launcher: ^6.3.2
  pdf: ^3.13.0
  printing: ^5.15.0
  firebase_auth: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/